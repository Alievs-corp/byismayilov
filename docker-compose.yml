name: byismayilov

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: byismayilov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: byismayilov
    ports:
      - "${POSTGRES_PORT:-5462}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byismayilov -d byismayilov"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: byismayilov
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9030:9000"
      - "9031:9001"
    volumes:
      - storage:/data

  storage-setup:
    image: amazon/aws-cli:2.38.2
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: byismayilov
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      AWS_DEFAULT_REGION: eu-central
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do aws --endpoint-url http://storage:9000 s3 ls >/dev/null 2>&1 && break; sleep 1; done
        aws --endpoint-url http://storage:9000 s3 mb s3://byismayilov 2>/dev/null || true
        aws --endpoint-url http://storage:9000 s3api put-bucket-cors --bucket byismayilov --cors-configuration '{"CORSRules":[{"AllowedOrigins":["http://localhost:3030"],"AllowedMethods":["PUT"],"AllowedHeaders":["content-type"],"MaxAgeSeconds":3600}]}'
        aws --endpoint-url http://storage:9000 s3api put-bucket-policy --bucket byismayilov --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::byismayilov/*"}]}'
        echo "bucket byismayilov ready"

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "1055:1025"
      - "8055:8025"

volumes:
  postgres:
  storage:
